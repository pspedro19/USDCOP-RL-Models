# MANIFIESTO INMUTABLE DE ESTRATEGIA (CTR-STRAT-MANIFEST-001, Fase 0 plan 2026-07-21)
# Congelado al publicar. Cambiar CUALQUIER campo = nueva version + re-freeze consciente:
# el test de regresion compara code_hash contra los fuentes actuales y falla en drift.
# El reloj de anualizacion va DECLARADO porque la libreria carga dos convenciones
# incompatibles (onboard-asset: BTC sqrt365 | motor xasset: 252 tras intersect) y ninguna
# metrica puede citarse sin la suya.
strategy_id: smart_simple_v11
surface: action
frozen: 2026-03-18 (v11 FROZEN; juez=forward 2026)
tz_storage: TIMESTAMPTZ instantes verdaderos (CTR-DQ-TZ-001); lectura AT TIME ZONE
  America/Bogota
session: 08:00-12:55 America/Bogota, Lun-Vie (60 barras M5)
freq:
  data: M5 + daily
  decision: weekly (senal lunes)
  execution: M5 en sesion, */30 min
clock:
  periods_per_year: 52
  label: weekly/52
  note: 'NUNCA 261: la estrategia toma <=1 posicion/semana'
model:
  kind: ml_ensemble
  members:
  - ridge
  - bayesian_ridge
  xgboost: OFFLINE-ONLY (use_xgboost:false, fail-closed; test estructural)
  retrain: semanal, ventana expansiva, scaler train-only
  features: 25
costs:
  maker_bps: 0.0
  weekend_exit_slippage_bps: 1.0
execution_lag: entrada lunes al cierre; HS/TP gestionados intra-semana
components:
- component_id: usdcop_ridge_br
  role: decision_input
  engine: ml_batch
  retrain_policy: weekly_expanding    # domingo, scaler train-only, ventana 2020->
  recipe_frozen: true                 # lo congelado es la RECETA, no los pesos
  recipe_note: >-
    cada reentrenamiento produce un model_snapshot semanal bajo el mismo spec; el check
    es 'receta congelada, snapshots registrados', nunca 'pesos inmutables'
  spec_fingerprint_sha256_16: 758456c8fcc51834   # sha256 canonico LF (CRLF->LF,
    # == blob git)[:16] sobre spec_fingerprint_inputs en orden (hiperparams
    # ridge alpha=1.0 / bayesian_ridge max_iter=300, ensemble mean — la RECETA)
  spec_fingerprint_inputs:    # declarados para que el fingerprint sea recomputable
  - scripts/pipeline/train_and_export_smart_simple.py
  - src/forecasting/enhance_v2.py
  - config/execution/smart_simple_v1.yaml
  code_reference:
  - scripts/pipeline/train_and_export_smart_simple.py
  - src/forecasting/enhance_v2.py
  code_hash_sha256_16: 60663704514cbec2   # mismo metodo que el hash del manifiesto (LF)
  feature_set:
    builder: src/forecasting/enhance_v2.py::enhance_features_v2
    recipe_feature_set_id: usdcop_smart_simple_v11_recipe25       # la RECETA (25)
    dag_snapshot_feature_set_id: usdcop_smart_simple_v11_dag_legacy23  # lo que el DAG persiste (23)
    recipe_n_features: 25    # 21 base + regime/carry/term (export/backtest, v2)
    snapshot_n_features: 23  # lista persistida por el DAG H5-L3 (feature_cols_h5.json)
    drift_note: >-
      divergencia AS-BUILT declarada, no resuelta aqui: el DAG semanal
      forecast_h5_l3_weekly_training persiste 23 columnas mientras la receta del
      export usa 25 (enhance_v2) — la divergencia vive entre DOS contratos
      explicitos (recipe25 vs dag_legacy23, config/features/feature_sets/) y su
      reconciliacion exige un BL propio
  current_model_snapshot:   # puntero ROTATIVO (lo reescribe H5-L3 cada domingo);
    # lo congelado es la receta (spec_fingerprint), JAMAS estos pesos
    pointer: outputs/forecasting/h5_weekly_models/latest/
    registered_in: MLflow run de forecast_h5_l3_weekly_training (tags git_commit,
      iso_week, contract FC-H5-L3-001)
    as_of: '2026-07-06'     # ultima corrida L3 local al sellar este re-freeze
    artifacts_sha256_16:
      ridge_h5.pkl: 8e4618c4d26d3af9
      bayesian_ridge_h5.pkl: 0c206dc55908c71a
      scaler_h5.pkl: 3302221e2b9dee39
      feature_cols_h5.json: c3393242ef998896
  # Linaje FT REAL (BL-10 IMPLEMENTED 2026-07-28), sustituye al placeholder
  # `pending-BL-10`. NO se eligio: se DERIVA del ledger con la MISMA consulta que
  # scripts/validation/check_trial_ledger.py::check_provenance_wall valida —
  #   asset == usdcop AND kind == forecast AND label == legacy_estimate
  # que da EXACTAMENTE FT-0001..FT-0048: los TRES bloques legacy COMPLETOS de la
  # familia usdcop_direction (zoo_y_previos_exp_dir_001 27 + forward_flow 14 +
  # intraday_latam_lead 7), todos en cluster ml_meta — el unico cluster en el que la
  # accion de usdcop deflacta (ADR-0022 §3). Corrobora el conteo la cabecera de
  # .claude/specs/assets/usdcop/EXP-DIR-001-directional-trials.md ("Trials
  # acumulados: 48"), que es el `source` de las 48 filas.
  # Se citan BLOQUES ENTEROS, jamas ids sueltos: las tres celdas son
  # `cell_kind: estimated_block` + `decomposable: false`, luego atribuir un FT-xxxx
  # concreto al par Ridge/BR seria FABRICAR granularidad — es la razon literal por la
  # que registries/families/smart_simple.yaml declara su herencia a nivel de FAMILIA.
  # Fuera por REGLA: FT-0049 (cluster `vol` != ml_meta; lo rechaza el propio muro).
  # Fuera por ETIQUETA: FT-0054/FT-0055 son `label: documented` (no legacy — este
  # campo es `_legacy`) y son otras pistas (H1 diario / transporte externo a MXN-BRL)
  # pre-registradas DESPUES del freeze de v11, luego no pudieron hacerlo posible.
  forecast_trial_ids_legacy: [FT-0001, FT-0002, FT-0003, FT-0004, FT-0005, FT-0006,
    FT-0007, FT-0008, FT-0009, FT-0010, FT-0011, FT-0012, FT-0013, FT-0014, FT-0015,
    FT-0016, FT-0017, FT-0018, FT-0019, FT-0020, FT-0021, FT-0022, FT-0023, FT-0024,
    FT-0025, FT-0026, FT-0027, FT-0028, FT-0029, FT-0030, FT-0031, FT-0032, FT-0033,
    FT-0034, FT-0035, FT-0036, FT-0037, FT-0038, FT-0039, FT-0040, FT-0041, FT-0042,
    FT-0043, FT-0044, FT-0045, FT-0046, FT-0047, FT-0048]
