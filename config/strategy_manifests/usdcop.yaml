    dag_snapshot_feature_set_id: usdcop_smart_simple_v11_dag_legacy23  # lo que el DAG persiste (23)
    recipe_n_features: 25    # 21 base + regime/carry/term (export/backtest, v2)
    snapshot_n_features: 23  # lista persistida por el DAG H5-L3 (feature_cols_h5.json)
