# CATALOGO ESTABLE DE FEATURES (CTR-FEATURE-CATALOG-001, BL-39)
# ============================================================================
# DATA-STRATEGY §40.1 + Plan Consolidado §1.4: el catalogo define QUE es cada
# feature (definicion, causalidad, fuente, transformacion, lookback, codigo);
# JAMAS contiene constantes de normalizacion (mean/std) — esas viven en el
# artefacto versionado (config/features/normalization_snapshots/*, §40.3).
# Cambiar UNA constante de normalizacion tras reentrenar sin snapshot versionado
# = leakage silencioso; ese anti-patron (`(vix-21.16)/7.89` en
# config.feature_definitions) es exactamente lo que este catalogo elimina.
#
# REGLAS (test: tests/regression/test_feature_contracts.py + validador
# scripts/validation/validate_feature_catalog.py — CI fail-closed):
#   - causality_policy OBLIGATORIA: point_in_time | same_bar | lagged_1
#   - sign_prior OBLIGATORIO (Anexo A.4): positive | negative | ambiguous.
#     'ambiguous' exige sign_prior_note. Features NUEVAS declaran su prior ANTES
#     de mirar datos (sin prior no entran al store); los priors de legacy_v1 de
#     abajo estan declarados EX-POST como DOCUMENTACION de la intuicion
#     economica (0 trials) — no son evidencia ni seleccion.
#   - code_reference + sha256_16 del archivo que computa la feature: editar ese
#     codigo sin re-registrar el hash = drift (test rojo). Re-registrar con
#     cambio SEMANTICO = feature nueva (version nueva), no una edicion.
#   - HASH CANONICO LF (CXD-041/043): todo sha256_16 sobre un ARCHIVO DE CODIGO
#     se computa sobre los bytes con CRLF->LF normalizado (== blob git con
#     .gitattributes text eol=lf) — reproducible con `git show :<path>` en
#     cualquier OS. Los hashes v1.0.0 se computaron sobre bytes CRLF del
#     working tree Windows y un checkout limpio no los reproducia.
#   - source_contract usa los nombres canonicos objetivo (market.canonical_bar,
#     macro.observation); `asbuilt_source` documenta la tabla/archivo actual
#     (§1.3 problema 3: no anclarse a tablas por renombrar).
#
# Version: 2.0.0 · Date: 2026-08-05 · Frozen scope preserved: v11 legacy_v1
# Refreeze 1.1.0 (CXD-041/043, BL-39-r2): canonicalizacion LF del hash de
# enhance_v2.py (13fc9f7864f0cc7a -> b601ae271c8e2b5f; dataset_loader.py ya era
# LF y no cambia), 0 cambios de contenido de codigo; + correcciones de
# documentacion contra el codigo real (causality de trend_slope_60d, memoria
# EWM del RSI, staleness de las macro lag1) con cita de linea; 0 trials.
# C032 2.0.0: identidad de consumo (asset_id, feature_id) + identidad fisica
# series_id; resolucion exact-one de todos los feature_sets y source_contract de
# mercado discriminado por activo. Declarativo, sin cambio de runtime/modelo, 0 trials.
contract_id: CTR-FEATURE-CATALOG-001
version: 2.0.0

# ── Gates: que corre en CI y que es local-only (CXD-041 punto 7) ───────────
ci_gates:
  ci:
  - scripts/validation/validate_feature_catalog.py         # schema estricto + drift de hashes LF
  - tests/regression/test_feature_contracts.py             # catalogo + feature sets + snapshot (declaraciones)
  - tests/regression/test_strategy_manifests.py            # freeze wall de manifiestos (hashes LF)
  local_only:
  - scripts/validation/bitcheck_v11_signal.py              # exige outputs/*.pkl (gitignored) — NO-CI
  - test_disk_artifacts_are_bit_identical_to_frozen_registration  # skip limpio sin artefactos
  - test_bitcheck_v11_signal_from_feature_set_plus_snapshot       # skip limpio sin artefactos
  note: >-
    Los inputs del bit-check (outputs/forecasting/**) estan gitignored: la
    bit-identidad solo es verificable donde vive el pipeline congelado. CI
    verifica TODO lo declarativo (schema, hashes LF de codigo, listas
    ordenadas, cross-locks manifiesto<->feature_set<->snapshot).
causality_policies: [point_in_time, same_bar, lagged_1]
sign_priors: [positive, negative, ambiguous]
legacy_note: >-
  Los 25 features de smart_simple_v11 se registran AS-BUILT (legacy_v1,
  bit-identicos al pipeline congelado). Este registro no cambia v11 en runtime
  y no gasta trials.

features:

