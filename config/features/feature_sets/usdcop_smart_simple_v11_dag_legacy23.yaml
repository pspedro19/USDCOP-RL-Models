# FEATURE SET POR ESTRATEGIA-VERSION (CTR-FEATURE-CATALOG-001, BL-39 / BL-39-r2)
# Lo que el DAG H5-L3 (forecast_h5_l3_weekly_training) PERSISTE de verdad hoy:
# 23 columnas (feature_cols_h5.json). El modelo y el scaler en produccion estan
# ajustados sobre ESTAS 23 — eso es lo bit-identico.
#
# CXD-041 (BL-39-r2): contrato hermano de usdcop_smart_simple_v11_recipe25 (25).
# La divergencia AS-BUILT (declarada por BL-14, drift_note del manifiesto v11)
# queda entre DOS contratos explicitos, no dentro de uno. Causa: en el entorno
# del DAG el enhancement macro fallo (MACRO_DAILY_CLEAN no resuelto =>
# rate_diff_ibr_ust2y/term_spread ausentes) y la lista persistida quedo en 23.
#
# v11 esta FROZEN: este archivo DECLARA el estado as-built (legacy_v1,
# bit-identico); no cambia runtime y no gasta trials (BL-39).
feature_set_id: usdcop_smart_simple_v11_dag_legacy23
supersedes: usdcop_smart_simple_v11_action_legacy_v1   # (era el bloque dag_snapshot)
strategy_id: smart_simple_v11
manifest_version: 12          # config/strategy_manifests/usdcop.yaml
asset_id: usdcop
surface: action
builder: src/forecasting/enhance_v2.py::enhance_features_v2  # macro merge FALLIDO en el DAG
resample_policy: P1D provider_official (bi.dim_daily_usdcop); PT5M solo ejecucion TP/HS (§42.4)
macro_bundle: [dxy, wti, vix, embi]   # T-1, merge_asof(backward), stale => bloquea señal

# ── Lo persistido (feature_cols_h5.json, as-of 2026-07-06): 23 features ────
