# ── Divergencia con la receta (contrato hermano) ───────────────────────────
drift:
  status: declared_not_resolved
  counterpart_feature_set_id: usdcop_smart_simple_v11_recipe25
  missing_vs_recipe: [rate_diff_ibr_ust2y, term_spread]
  cause: >-
    enhance_features_v2 en el contenedor del DAG no resolvio las columnas SSOT
    de MACRO_DAILY_CLEAN => las 2 features derivadas no se crearon y la lista
    persistida quedo en 23. El export/backtest (macro OK) usa 25.
  resolution: >-
    Reconciliar 25 vs 23 exige su propio BL + re-freeze consciente del
    manifiesto (decidir que features valen = decision de MODELADO, 0 trials
    aqui). Mientras tanto el test de regresion exige que el snapshot en disco
    siga siendo EXACTAMENTE esta lista de 23 (bit-check).

# ── Normalizacion → artefacto versionado (JAMAS en el catalogo, §40.3) ─────
# El scaler legacy_v1 se ajusto sobre ESTAS 23 columnas: por eso el snapshot
# referencia ESTE contrato, no la receta de 25.
normalization_snapshot_id: usdcop_h5_scaler_legacy_v1
