- {feature_id: return_10d,          order: 6,  required: true}
- {feature_id: return_20d,          order: 7,  required: true}
- {feature_id: volatility_5d,       order: 8,  required: true}
- {feature_id: volatility_10d,      order: 9,  required: true}
- {feature_id: volatility_20d,      order: 10, required: true}
- {feature_id: rsi_14d,             order: 11, required: true}
- {feature_id: ma_ratio_20d,        order: 12, required: true}
- {feature_id: ma_ratio_50d,        order: 13, required: true}
- {feature_id: day_of_week,         order: 14, required: true}
- {feature_id: month,               order: 15, required: true}
- {feature_id: is_month_end,        order: 16, required: true}
- {feature_id: dxy_close_lag1,      order: 17, required: true}
- {feature_id: oil_close_lag1,      order: 18, required: true}
- {feature_id: vix_close_lag1,      order: 19, required: true}
