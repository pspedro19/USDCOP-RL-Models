# FEATURE SET POR ESTRATEGIA-VERSION (CTR-FEATURE-CATALOG-001, BL-39 / BL-39-r2)
# DATA-STRATEGY §40.2/§42 — la RECETA de smart_simple_v11: lo que el
# export/backtest construye (enhance_features_v2 con macro OK) = 25 features.
#
# CXD-041 (BL-39-r2): la divergencia receta-vs-DAG ya NO vive dentro de un solo
# contrato. Son DOS contratos explicitos:
#   - usdcop_smart_simple_v11_recipe25      (ESTE: la receta, 25)
#   - usdcop_smart_simple_v11_dag_legacy23  (lo que el DAG H5-L3 persiste hoy, 23)
# El snapshot de normalizacion legacy_v1 referencia el legacy23 (su scaler se
# ajusto sobre esas 23), no esta receta.
#
# v11 esta FROZEN: este archivo DECLARA el estado as-built; no cambia runtime y
# no gasta trials (BL-39).
feature_set_id: usdcop_smart_simple_v11_recipe25
supersedes: usdcop_smart_simple_v11_action_legacy_v1   # contrato unico pre-split (CXD-041)
strategy_id: smart_simple_v11
manifest_version: 12          # config/strategy_manifests/usdcop.yaml
asset_id: usdcop
surface: action
builder: src/forecasting/enhance_v2.py::enhance_features_v2  # sobre base dataset_loader (21)
resample_policy: P1D provider_official (bi.dim_daily_usdcop); PT5M solo ejecucion TP/HS (§42.4)
macro_bundle: [dxy, wti, vix, embi]   # T-1, merge_asof(backward), stale => bloquea señal

# §42.5: v12/v14 referencian el MISMO decision input que v11 (comparacion pareada).
shared_by: [smart_simple_v12, smart_simple_v14]

# ── RECETA (export/backtest, enhance_v2 con macro OK): 25 features ─────────
ordered_features:
- {feature_id: close,               order: 0,  required: true}
