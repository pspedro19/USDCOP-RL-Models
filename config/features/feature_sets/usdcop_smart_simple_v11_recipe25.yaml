ordered_feature_hash_sha256_16: 50574a81bb21a035  # sha256(json.dumps(lista))[:16]
  # hash de CONTENIDO DE DATOS (la lista serializada), NO de un archivo:
  # la canonicalizacion LF de CXD-041 no aplica aqui.

# ── Divergencia con lo persistido por el DAG (contrato hermano) ────────────
divergence:
  status: declared_not_resolved
  counterpart_feature_set_id: usdcop_smart_simple_v11_dag_legacy23
  missing_in_counterpart: [rate_diff_ibr_ust2y, term_spread]
  note: >-
    El DAG H5-L3 persiste 23 columnas (ver contrato hermano); esta receta usa
    25. Reconciliar exige su propio BL + re-freeze consciente del manifiesto.

# ── Normalizacion ──────────────────────────────────────────────────────────
# La receta NO tiene snapshot de normalizacion registrado: el scaler de
# produccion (legacy_v1) se ajusto sobre las 23 del DAG y lo referencia el
# contrato hermano. El path de export/backtest ajusta su propio scaler
# train-only POR CORRIDA (walk-forward) y no persiste artefacto registrable.
normalization_snapshot_id: null
normalization_note: >-
  scaler train-only por corrida en el export (no persistido); el unico scaler
  persistido en produccion es usdcop_h5_scaler_legacy_v1, ajustado sobre el
  feature set usdcop_smart_simple_v11_dag_legacy23 (23).
