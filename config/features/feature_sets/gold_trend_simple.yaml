# FEATURE SET POR ESTRATEGIA-VERSION (CTR-FEATURE-CATALOG-001, BL-39)
# §45: la rule-based declara su set minimo de inputs.
#
# CORRECCION 2026-08-06 (slice Gold, CXD-631). La cabecera decia que "los votos
# SMA{63,126,252} y rv20 se derivan DENTRO del codigo de la politica congelada".
# Era FALSO: `GoldTrendSimplePolicy` lo dice en su propio docstring -- "the policy
# only consumes them" -- y las declara `required`. Mientras vivieron aqui como
# derivadas, ningun productor las materializaba y la policy habria fallado por
# `missing` en toda corrida. Las cuatro pasan a ORDENADAS.
# (manifiesto xauusd.yaml, code_hash bc494207ee2916d8 — canonico LF desde CXD-041)
feature_set_id: xauusd_gold_trend_simple_action_v1
strategy_id: gold_trend_simple
manifest_version: 2
asset_id: xauusd
surface: action
resample_policy: P1D provider_official (daily UTC-anclado; JAMAS tz_convert(ET).normalize())
macro_bundle: []              # ninguna macro en ACTION actual (§45.1)

ordered_features:
- {feature_id: close, order: 0, required: true}
- {feature_id: sma_63, order: 1, required: true}
- {feature_id: sma_126, order: 2, required: true}
- {feature_id: sma_252, order: 3, required: true}
- {feature_id: realized_vol_20, order: 4, required: true}

# Solo derivaciones REALES: lo que la politica calcula DENTRO a partir de las
# ordenadas. El voto y el sizing son REGLAS sobre esos inputs, no features.
derived_in_policy:
- voto binario >=2 sobre las tres SMA          # regla, no feature
- sizing vol_target 0.10 / rv20, clip[0.06, 1.5]
retrain: never
normalization_snapshot_id: null   # sin scaler: constantes fijas, retrain NUNCA
