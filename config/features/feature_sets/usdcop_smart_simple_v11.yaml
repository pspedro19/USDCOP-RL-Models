  snapshot_id: usdcop_h5_feature_cols_legacy_v1
  source_file: outputs/forecasting/h5_weekly_models/latest/feature_cols_h5.json
  as_of: '2026-07-06'          # ultima corrida H5-L3 local (manifiesto v11)
  file_sha256_16: c3393242ef998896   # == manifest artifacts_sha256_16
  ordered_features:
