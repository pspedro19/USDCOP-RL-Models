# POLICY SPEC (qlab_policy_v1) — BL-47 R6, primera migración
# =========================================================
# Estrategia REAL del repo: `spx500_daily_ma200_v1`, el baseline operativo simple
# publicado junto a la gated por scripts/pipeline/publish_spx500_bundles.py.
# Camino legacy (patrón de paridad):
#   sleeve.dumb_position = (close > SMA200)  ->  np.roll(..., 1)  (ejecución next-open)
# Aquí SOLO se declara la DECISIÓN (t); el lag de ejecución vive en el runner,
# igual que en el legacy (ERRATUM 2026-07-21: shift exactamente una vez).
#
# 0 trials: misma ventana (200), mismo operador (>), misma exposición (1/0).
# Cualquier cambio de umbral/ventana/orden = MODELADO = nueva versión + trial.
id: spx500_daily_ma200_v1
asset: spx500
family: trend
research_cluster: trend
surface: action
version: 1.1.0

engine:
  type: rule_based
  retrain: never
  implementation:
    mode: declarative
    schema: qlab_policy_v1

inputs:
  # Feature-set PROPIO (v1.1.0, decisión C): declara {close, ma_200} y `ma_200` se
  # materializa por el productor único `src/features/spx500_ma200.py`, catalogada
  # como `spx500.ma_200`. NO es derivada dentro de la política: el DSL no tiene
  # operador de ventana y una policy declarativa no puede derivar una media.
  #
  # Aquí decía, hasta 2026-08-06, que esta política "consume el MISMO snapshot
  # diario, subconjunto {close}, y la media se registra como feature derivada".
  # Era FALSO en las dos mitades y se contradecía con su propio `required_features`
  # tres líneas más abajo: la media no era derivada por nadie —se calculaba inline
  # en el harness de paridad, sin catálogo ni productor— y el subconjunto {close}
  # habría hecho fallar la policy por `missing` en toda corrida (CXD-618 §3).
  feature_set_id: spx500_daily_ma200_v1_action_v1
  # Hash del CONTENIDO decisorio del set (no del fichero: un comentario no mueve la
  # identidad). Entra en `canonical_policy_payload`, asi que anadir o quitar una
  # feature de entrada obliga a nueva version de la policy — el `feature_set_id` solo
  # no lo garantizaba (CXD-623, piloto).
  feature_set_hash: sha256:9d5306397304610e77c3b8ee1f2e09b6d6a962ae9cc8faa003217ab9748b7440
  resample_policy_id: spx500_daily_official_v1
  required_features: [close, ma_200]
  optional_features: []
  decision_point: session_close
  execution_ref: next_open
  # 200 sesiones de calentamiento: sin MA200 no hay snapshot => no hay decisión.
  # El legacy expresaba lo mismo con min_periods=200 -> NaN -> comparación False
  # -> exposición 0. Misma exposición, sin inventar una decisión.
  warmup_bars: 200

policy:
  params:
    ma_window: 200
    exposure_when_on: 1.0
    exposure_when_off: 0.0
  resolution:
    mode: first_match
    default_target_exposure: 0.0
    default_direction: FLAT
    default_reason_code: CLOSE_BELOW_MA200
  # Resolución de conflictos: prioridad descendente, first_match. Con una sola
  # regla + default explícito no hay ambigüedad posible (invariante 9).
  conflict_resolution: priority_desc_first_match
  missing_input_policy: FAIL_CLOSED
  stale_input_policy: FLAT
  rules:
    - id: close_above_ma200
      label: Cierre sobre la media de 200 sesiones
      priority: 100
      when:
        operator: greater_than
        left: feature.close
        right: feature.ma_200
      output:
        direction: LONG
        target_exposure: 1.0
        reason_code: CLOSE_ABOVE_MA200

governance:
  data_cutoff: null            # baseline sin entrenamiento: no hay cutoff de ajuste
  frozen_at: '2026-07-28'
  ssot_manifest: config/strategy_manifests/spx500.yaml
  manifest_code_hash_sha256_16: ea76413e60621521
  policy_hash: sha256:44e83b9e885112449de97b2cbe1eab590065dc9b99c81f69a25d8e523dbef992
  policy_hash_v1_1_0_pre_fs_hash: sha256:2d8638ed90a6ca5d8b18b0aed86ecad0812133745c80a4b0a4e7993f80de80f7
  policy_hash_v1_0_0: sha256:c00e63c676f2c96e0f32972f4b6c3d9f65d34cf4bbef2135774802ce41864d19
  policy_hash_note: >-
    v1.1.0 cambia `inputs.feature_set_id` (spx500_regime_gated_v1_action_v1 ->
    spx500_daily_ma200_v1_action_v1), que ENTRA en `canonical_policy_payload`, asi
    que la identidad se mueve. Se conserva el hash de v1.0.0 para que la paridad
    contra lo publicado siga siendo auditable: un hash que desaparece no deja
    comparar. Segundo movimiento dentro de v1.1.0: al declarar
    `inputs.feature_set_hash` (piloto CXD-623) el payload gana una clave y la
    identidad vuelve a moverse. Se conservan los DOS hashes previos por la misma
    razon. Sigue siendo 0 trials: no cambia ventana, umbral, salida ni sizing.
  trials_charged: 0
  trials_note: >-
    Migración de representación (publisher -> motor de políticas). No cambia
    ventana, umbral, salida ni sizing => 0 trials (§10 "no cobra trial:
    reejecutar una política congelada"). v1.1.0 mantiene 0 trials por la MISMA
    razón: cambia quién DECLARA `ma_200` (feature-set propio + catálogo +
    productor único), no cuánto vale ni cuándo dispara. La paridad se demuestra
    sobre la serie completa; si no reprodujera bit a bit lo publicado, sería un
    cambio económico disfrazado de fontanería y NO sería 0 trials.

migration:
  # DEMOCION DELIBERADA (decision C, CXD-608 §5). v1.0.0 alcanzó PARITY_GREEN con el
  # harness oficial (7743 barras, exposición idéntica en float64). v1.1.0 es OTRA
  # identidad —`policy_hash` distinto—, así que NO hereda ese veredicto: heredarlo
  # por inercia sería exactamente el tipo de verde que este repo lleva días cazando.
  # Efecto inmediato y buscado: `resolve_policy_runs` deja de emitir cadena para
  # spx500 (PARITY_PENDING no es elegible). Se apaga sola mientras se revalida.
  # La RE-PROMOCION es acto EXCLUSIVO del operador; ningún agente la ejecuta.
  status: PARITY_PENDING
  status_v1_0_0: PARITY_GREEN
  legacy_producer: scripts/pipeline/publish_spx500_bundles.py (arm MA200_ID)
  legacy_reference: scripts/analysis/profitability_adapters.py::spx500 (dumb_position)
  # Promovido a PARITY_GREEN con el HARNESS OFICIAL, no por inferencia:
  #   python scripts/validation/check_policy_parity.py --policy spx500_daily_ma200_v1
  #   [OK] 7743 barras, exposicion IDENTICA (float64), 2026-08-05
  # Nota: mi test ad-hoc de CLD-448 comparaba contra benchmarks.py::_ma200, que NO es
  # el productor declarado aqui. Esa comparacion sigue siendo valida sobre _ma200, pero
  # NO era la paridad que esta ficha exige.
  parity_evidence: "check_policy_parity 7743 bars identical float64 (2026-08-05)"
  parity_harness: scripts/validation/check_policy_parity.py --policy spx500_daily_ma200_v1
  parity_criterion: >-
    Igualdad EXACTA de la serie de exposición en fecha de decisión (float64,
    sin tolerancia) sobre toda la ventana del snapshot. No se apaga el camino
    viejo hasta ≥2 semanas de paridad verde (calendario BL-28/31).
  rollback: >-
    Revertir a publish_spx500_bundles.py; los bundles son inmutables por
    (version, año), así que un rollback no reescribe historia publicada.

judge:
  anchor: forward
  criterion: >-
    Es el baseline tonto del track SPX. Su papel es ser batido, no promoverse:
    el re-freeze v2 documenta que la gated PIERDE contra él (Calmar 0.2115 vs
    0.1439). Sin claim de alfa.

capabilities: [backtest, signal, verify]

explainability:
  trace_schema: rule_trace_v1
  reason_codes: [CLOSE_ABOVE_MA200, CLOSE_BELOW_MA200]

presentation:
  engine_label: Reglas MA200
  description: Exposición 1x cuando el cierre supera la media de 200 sesiones
  components:
    - {key: close, label: Cierre, format: price}
    - {key: ma_200, label: Media móvil 200, format: price}
