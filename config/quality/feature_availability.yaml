version: "1.1.0"
max_age_hours: 24
# Architectural prior: the final news measurement is scheduled for 18:00 UTC
# and weekly analysis for 19:00 UTC. Airflow has no real news_daily_pipeline
# runs yet, so this is not an empirically measured latency percentile. Revisit
# after production DagRuns provide a representative duration sample.
max_publish_lag_minutes: 60
features:
  - feature_id: macro_banrep_forwards_monthly.forward_rate
    table: macro_banrep_forwards_monthly
    column: forward_rate
    time_column: published_at
    require_variation: true
  - feature_id: crypto_derivatives_daily.liquidations_usd
    table: crypto_derivatives_daily
    column: liquidations_usd
    time_column: published_at
    require_variation: true
  - feature_id: crypto_derivatives_daily.open_interest
    table: crypto_derivatives_daily
    column: open_interest
    time_column: published_at
    require_variation: true
  - feature_id: crypto_derivatives_daily.long_short_ratio
    table: crypto_derivatives_daily
    column: long_short_ratio
    time_column: published_at
    require_variation: true
  - feature_id: news_articles.sentiment_score
    table: news_articles
    column: sentiment_score
    time_column: published_at
    require_variation: true
  - feature_id: news_articles.sentiment_label
    table: news_articles
    column: sentiment_label
    time_column: published_at
    require_variation: true
  - feature_id: news_articles.gdelt_tone
    table: news_articles
    column: gdelt_tone
    time_column: published_at
    require_variation: true
