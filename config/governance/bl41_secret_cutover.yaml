  legacy_credential_tables_empty_under_lock:
    ready: false
    evidence: null
    relations:
      - public.exchange_credentials
      - public.sb_exchange_credentials
      - public.user_exchange_keys
  runtime_roles_non_superuser:
    ready: false
    evidence: null
    requirement: application and migration roles proven non-superuser
  migration_runner_fail_closed:
    ready: false
    evidence: null
    requirement: explicit plan plus ON_ERROR_STOP-equivalent behavior
  consumers_cutover_coordinated:
    ready: false
    evidence: null
    consumers:
      - services/signalbridge_api
      - usdcop-trading-dashboard
  operator_authorization:
    ready: false
    evidence: null
    requirement: explicit operator approval for the DDL and consumer cutover window
operator_actions:
  - provision and exercise the external secret store
  - prove all three legacy credential relations empty under an exclusive lock
  - replace superuser runtime identities with least-privilege roles
  - approve the breaking consumer cutover contract
  - schedule the migration and rollback window
prohibitions:
  - no credential values in PostgreSQL
  - no DDL cutover while any precondition is false
  - no claim of completion from static repository evidence alone
