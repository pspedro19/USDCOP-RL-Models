name: fabric-contracts

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usdcop-trading-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: usdcop-trading-dashboard/package-lock.json
      - run: npm ci
      - run: npm run rbac:check
      - run: npm run rbac:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TypeScript delta gate
        run: python scripts/validation/check_monitor_delta.py --monitor tsc_dashboard
      - name: Vitest delta gate
        run: python scripts/validation/check_monitor_delta.py --monitor vitest_dashboard_unit

  dashboard-playwright-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: usdcop-trading-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: usdcop-trading-dashboard/package-lock.json
      - run: npm ci
      - name: Prepare browser evidence sink
        run: |
          mkdir -p test-results
          : > playwright-server.log
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build fresh production artifact
        run: npm run build
      - name: Run serial public and read-only browser contracts
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          : > playwright-server.log
          npm run start >> playwright-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            result=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:5000/login >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat playwright-server.log
            exit 1
          fi

          npx playwright test \
            tests/e2e/ci-public-readonly.spec.ts \
            tests/e2e/replay-read-only.spec.ts \
            --project=chromium \
            --workers=1 \
            --grep 'CI public|anon:'
      - name: Publish Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-playwright-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            usdcop-trading-dashboard/playwright-report
            usdcop-trading-dashboard/test-results
            usdcop-trading-dashboard/playwright-server.log

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml numpy scipy
      - name: Python frontmatter delta gate
        run: python scripts/validation/check_monitor_delta.py --monitor pytest_knowledge_frontmatter
      - run: python -m pytest tests/regression/test_strategy_manifests.py tests/regression/test_feature_contracts.py tests/regression/test_bl08_env_history_control.py tests/regression/test_scripts_layout.py -q
      - name: Enforce diagnostic-only forecasting surfaces
        run: python -m pytest tests/regression/test_forecasting_caveat_present.py -q
      - run: python -m pytest tests/regression/test_approval_mutual_exclusion.py tests/unit/test_codex_phase2_backlog.py -q
      - name: BL-16 constitutional declaration and canonical JSON gates
        run: >-
          python -m pytest
          tests/unit/test_codex_fabric_contracts.py::test_governance_matrix_has_exactly_26_legal_state_combinations
          tests/unit/test_codex_safety_contracts.py::test_illegal_governance_object_cannot_exist
          tests/unit/test_codex_safety_contracts.py::test_canonical_json_rejects_nonfinite_numbers
          -q
      - run: python scripts/validation/check_trial_ledger.py
      - run: python scripts/validation/report_ledger_dsr.py
      - run: python scripts/validation/validate_policy_specs.py
      # `--allow-empty` es una DECLARACION, no un ablandamiento. El gate solo verifica
      # policies en PARITY_GREEN/CUTOVER y hoy no hay ninguna elegible. Sin el flag sale
      # ROJO a proposito, porque un paso que corre sin sujeto y devuelve 0 se lee como
      # "verificado" cuando no verifico nada — que es lo que este step hacia en silencio
      # hasta 2026-08-06. El conteo exacto de policies inertes NO se anota aqui: el gate
      # lo mide en cada corrida y un numero en un comentario solo envejece mal.
      #   owner: workstream de migracion de policies (BL-47)
      #   cancelacion: se BORRA `--allow-empty` en cuanto una policy llegue a
      #          PARITY_GREEN o CUTOVER. Nadie debe promover una policy solo para darle
      #          sujeto al gate: eso seria la trampa que este cambio denuncia.
      - name: Require exact parity for executable policy migrations
        run: python scripts/validation/check_policy_parity.py --ci-eligible --allow-empty
      - name: Reject new governed-metric bypasses
        run: python scripts/validation/validate_fabric_contracts.py
      - name: Publish baseline contract
        run: test -f .claude/coordination/BASELINE.md

  migration-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pytest tests/unit/test_codex_phase2_backlog.py -q
      - name: Require explicitly planned migration files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            database/migrations/059_checkout_order_ledger.sql \
            database/migrations/080_market_physical_profile.sql \
            database/migrations/081_synthetic_demo_isolation.sql \
            database/migrations/082_checkout_order_retry_transition.sql; do
            test -f "$f"
            git ls-files --error-unmatch "$f" >/dev/null
          done
