# =============================================================================
# CI Pipeline — USDCOP Trading System
# =============================================================================
# Runs lint, type check, unit tests (with 70% coverage gate), and build.
# Uses pyproject.toml for dependency installation.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  COVERAGE_THRESHOLD: 70

jobs:
  # ===========================================================================
  # Lint & Format Check
  # ===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff black isort

      - name: Run ruff
        run: ruff check src/ services/ tests/ --output-format=github

      - name: Check black formatting
        run: black --check --diff src/ services/ tests/

      - name: Check import sorting
        run: isort --check-only --diff src/ services/ tests/

  # ===========================================================================
  # Type Checking with MyPy
  # ===========================================================================
  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-mypy-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e "." 2>/dev/null || true
          pip install mypy types-PyYAML types-redis types-requests numpy pandas-stubs

      - name: Run mypy (informational)
        run: mypy src/ --ignore-missing-imports --no-error-summary 2>&1 | head -50 || true
        continue-on-error: true

  # ===========================================================================
  # Unit Tests with Coverage Gate
  # ===========================================================================
  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,forecasting,database]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          POSTGRES_PASSWORD: test
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov=services \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -v \
            --tb=short \
            -x

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ===========================================================================
  # Regression Gates
  # ---------------------------------------------------------------------------
  # POR QUE EXISTE ESTE JOB. `tests/regression/` tiene 66 ficheros y hasta ahora
  # CI solo nombraba 13, repartidos entre fabric-contracts.yml y specs-gate.yml.
  # Los otros 53 no los ejecutaba NADIE: gates escritos, funcionando, y sin
  # llamador. Uno de ellos —test_macro_clean_fx_scale— llevaba detectando un
  # empalme de escala real en USDMXN/USDCLP sin que nadie lo viera.
  #
  # El directorio entero es el sujeto. Si algun dia hay que excluir algo, se
  # excluye POR NOMBRE, con motivo, owner y condicion que lo cancela — nunca en
  # silencio. `tests/unit/test_regression_ci_wiring.py` lo vigila.
  # ===========================================================================
  regression-test:
    name: Regression Gates
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-regression-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-regression-

      # `data` va AQUI y no es opcional: declara `pyarrow`, y sin el
      # `pandas.read_parquet` revienta por engine ausente. Seis ficheros de
      # `tests/regression/` tocan parquet y TRES estan en el step bloqueante
      # (test_cop_features_pit, test_feature_contracts, test_macro_features_are_live),
      # asi que sin esta extra el job caeria por el motivo equivocado — y la
      # cuarentena FX moriria antes de llegar al assert de escala, perdiendo justo
      # el diagnostico por el que existe.
      #
      # NO se anade `ml`: arrastraria torch a cada corrida de CI, y esa es una
      # decision de coste que no toma este slice.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,forecasting,database,data]"
          pip install pytest pytest-asyncio

      # El step BLOQUEANTE. Corre el directorio COMPLETO menos exactamente los dos
      # ficheros en cuarentena declarada, cada uno con su step visible mas abajo.
      # Sin `continue-on-error`, sin `|| true`: si algo aqui cae, el job cae.
      - name: Run regression gates (blocking)
        run: |
          pytest tests/regression/ \
            --ignore=tests/regression/test_macro_clean_fx_scale.py \
            -q --tb=short

      # CUARENTENA 1 — rojo ESPERADO y VISIBLE, no un silencio.
      #   motivo: MACRO_DAILY_CLEAN/MASTER traen un empalme de escala en
      #           USDMXN (x10^4) y USDCLP (x10^2) desde 2026-06-26/29. El fix de
      #           2026-07-21 reparo CLEAN pero no MASTER, y una regeneracion
      #           posterior lo devolvio. El dato malo es real; el detector acierta.
      #   owner: CODEX (raiz en fuente) + CLAUDE (diagnostico, CLD-627/628/629)
      #   cancelacion: se BORRA este step cuando haya repair autoritativo y el
      #           test pase. Hoy esta bloqueado: la DB viva tiene 0 filas, asi que
      #           no existe fuente de la que reparar sin inventar numeros.
      - name: 'QUARANTINE (non-blocking): FX scale splice in MACRO_DAILY_CLEAN'
        continue-on-error: true
        run: pytest tests/regression/test_macro_clean_fx_scale.py -q --tb=short

      # Aqui hubo una CUARENTENA 2 para `test_action_threshold_ssot.py`: importar
      # `src.training.config` —una dataclass pura— disparaba el `__init__` del
      # paquete, que arrastraba engine/environments/trainers y con ellos
      # `stable_baselines3`, ausente en este job. Se retira porque su condicion de
      # cancelacion SE CUMPLIO: `9b67ffa8` volvio esos reexports lazy (PEP 562) y el
      # gate pasa 2/2 con sb3 genuinamente ausente. Vuelve al step bloqueante.

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,forecasting,database]"
          pip install pytest pytest-asyncio

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          POSTGRES_PASSWORD: test
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -x \
            --ignore=tests/integration/test_database_schema.py
        continue-on-error: true

  # ===========================================================================
  # Build Check
  # ===========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inference API image
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/Dockerfile.api
          push: false
          tags: usdcop/inference-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage threshold: **${{ env.COVERAGE_THRESHOLD }}%**" >> $GITHUB_STEP_SUMMARY
