provenance:
  crosses_wall: false
  note: >-
    Familia de POLITICA de reglas (gate de tendencia/regimen sobre precio): no convierte
    ningun artefacto predictivo en senal, luego no hereda FT. Si alguna variante futura
    alimentara el gate con un forecast, ese cruce cobra su propio AT con provenance
    (ADR-0022 2) y esta familia dejaria de ser crosses_wall: false.

