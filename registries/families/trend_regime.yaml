# BL-11 PILOTO — familia transversal ACTION (FABRIC §9.4, ADR-0022)
# La misma mecánica (gate de tendencia/régimen vs baseline) probada en 3 activos = UNA
# familia, N celdas, N trials — nunca tres registries "independientes" que subestiman la
# deflación cruzada. Backfill 2026-07-27 con etiqueta legacy_estimate (BL-10): los conteos
# gruesos NO cambian el n_trials_total de ningún activo (verificado por
# scripts/validation/check_trial_ledger.py).
family_id: trend_regime
kind: action
cluster_id: trend
declared_at: "2026-07-27"
declared_by: claude-backfill-bl11   # operador Pedro, protocolo .claude/coordination
question: "¿Un gate de tendencia/régimen mejora el Calmar neto contra el baseline tonto del activo?"
bar: >-
  Batir al baseline tonto del activo y a B1' neto de costos (stress x1/x2/x3);
  cualquier claim de edge exige DSR_family > 0.95 (quant-constitution §2);
  N<20 trades => solo conteo y PnL. Cerrar la familia por escrito es un estado válido.
screening_cutoff: null   # legacy: cada celda conserva su cutoff propio en el ledger
label: legacy_estimate
hypothesis_key: trend_regime_gate_vs_dumb_baseline
sibling_families: []
deflation_scope: family

# --- BL-09-r2: gate DSR real (no informativo) ------------------------------------------
governance:
  gate: "DSR_family > 0.95 (sigma menos favorable de la rejilla pre-declarada)"
  claims_edge: false
  claims_edge_note: >-
    Ninguna celda de esta familia reclama edge: Oro DSR 0.0077-0.0511 (el +38% OOS es
    ingenieria de riesgo sobre el beta), SPX PIERDE contra el ma200 tonto ("el baseline ES
    la estrategia"), BTC S4 no cumple su gate pre-registrado. Se publica tal cual.
  candidates:
    - id: gold_dynamic_exit_evidence_20260721
      published_dsr:
        value: 0.0511
        n_trials_used: 93
        source: ".claude/evidence/profitability/2026-07-21/xauusd.json"
        note: "Cota superior: n_trials_used(93) <= N_family(94); el DSR es no-creciente en n_trials."
    - id: spx500_regime_gated_v1_evidence_20260727
      published_dsr:
        value: 0.7831
        n_trials_used: 23
        source: ".claude/evidence/profitability/2026-07-27/spx500.json"
        note: "Cota superior con N por activo (23) muy inferior al N_family(94) del ledger."
    - id: btc_trend_b2_evidence_20260721
      published_dsr:
        value: 0.0403
        n_trials_used: 48
        source: ".claude/evidence/profitability/2026-07-21/btcusdt.json"
        note: "Cota superior: n_trials_used(48) <= N_family(94)."

cells:
  # ---- XAU/USD (75 trials: 74 legacy_estimate + 1 documentado) ----
  - asset: xauusd
    variant: legacy_trials_program
    cell_kind: estimated_block
    trial_id_range: {from: AT-0061, to: AT-0134}
    n_trials: 74
    decomposable: false
    granularity_note: >-
      NO descomponible por criterio objetivo: el 74 es una CONSTANTE de codigo
      (publish_gold_dynexit.py:48 `TRIALS_PROGRAM = 74`) heredada sin registro por celda.
      El suelo verificable son 21 bundles publicados; se conserva el 74 por ser el mas
      conservador. Desagregarlo exigiria inventar 74 variantes que nadie escribio: se deja
      como bloque estimado por escrito (FABRIC 10.2), que es la exencion justificada.
    provenance_source: "scripts/pipeline/publish_gold_dynexit.py"
    cutoff_class: legacy_irrecoverable
    cutoff_evidence: null
    status: EVALUATED
    result: fail
    note: >-
      legacy_estimate — TRIALS_PROGRAM=74 heredado sin procedencia documentada
      (publish_gold_dynexit.py:48); se conserva por ser el más conservador (74 > 21 bundles
      publicados). gold_dynamic_exit DSR 0.0077 con N=74: el +55% se explica por selección.
      Las celdas _s05/_s07 son sensibilidades publicadas como estrategias separadas.
  - asset: xauusd
    variant: gold_trend_simple_h_simp_gold_01
    cell_kind: atomic
    trial_id: AT-0135
    n_trials: 1
    hypothesis_id: H-SIMP-GOLD-01
    cutoff_class: documented_in_registry
    cutoff_evidence: ".claude/specs/assets/xauusd/HYPOTHESIS-REGISTRY.md"
