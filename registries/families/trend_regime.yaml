  # ---- SPX500 (16 trials: 14 legacy_estimate + 2 documentados) ----
  - asset: spx500
    variant: config_family_grid_12_y_b1_b2_s3
    cell_kind: grid_block
    trial_id_range: {from: AT-0169, to: AT-0182}
    n_trials: 14
    # BL-11-r2: granularidad REAL del bloque. Los ejes existen y estan documentados
